ion\n\n          Bearer Token required (Technician only).\n\n          ## Validation Rules\n\n          - A valid access token must be provided.\n          - The authenticated user must have an associated technician profile.\n          - Service data must satisfy the required validation rules.\n          - The service is automatically linked to the authenticated technician.\n\n          ## Response\n\n          - Creates and returns the newly created service.\n          - Returns `401 Unauthorized` if the user is not authenticated.\n          - Returns `403 Forbidden` if the user does not have a technician profile.\n      - info:\n          name: Get All Services\n          type: http\n          seq: 3\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/services'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Retrieves a list of available services.\n\n          ## Authorization\n\n          No authorization required.\n\n          ## Validation Rules\n\n          - No authentication is required.\n          - Optional filters or query parameters can be provided to refine service results.\n\n          ## Response\n\n          - Returns a list of available services.\n          - Returns an empty list if no services are found.\n  - info:\n      name: service-category\n      type: folder\n      seq: 8\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Get All Categories\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/categories'\n          auth:\n            type: bearer\n            token: ''\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Retrieves all available service categories.\n\n          ## Authorization\n\n ed` if the access token is missing or invalid.\n          - Returns `403 Forbidden` if the authenticated user is not an administrator.\n      - info:\n          name: Update Category\n          type: http\n          seq: 3\n        http:\n          method: PATCH\n          url: '{{baseUrl}}/api/v1/categories/:categoryId'\n          params:\n            - name: categoryId\n              value: ''\n              type: path\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Updates an existing service category.\n\n          ## Authorization\n\n          Bearer Token required (Admin only).\n\n          ## Validation Rules\n\n          - A valid access token must be provided.\n          - The authenticated user must have the `ADMIN` role.\n          - `id` (Category ID) is required as a path parameter.\n          - Category update data must satisfy the required validation rules.\n          - The category must exist before updating.\n\n          ## Response\n\n          - Returns the updated category information.\n          - Returns `401 Unauthorized` if the access token is missing or invalid.\n          - Returns `403 Forbidden` if the authenticated user is not an administrator.\n          - Returns `404 Not Found` if the category does not exist.\n      - info:\n          name: Delete Category\n          type: http\n          seq: 4\n        http:\n          method: DELETE\n          url: '{{baseUrl}}/api/v1/categories/:categoryId'\n          params:\n            - name: categoryId\n              value: ''\n              type: path\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Deletes an existing service category.\n\n          ## Authorization\n\n          Bearer Token required (Admin only).\n\n          ## Validation Rules\n\n          - A valid access token must be provided.\n          - The authenticated user must have the `ADMIN` role.\n          - `id` (Category ID) is required as a path parameter.\n          - The category must exist before deletion.\n\n          ## Response\n\n          - Deletes and returns the deleted category information.\n          - Returns `401 Unauthorized` if the access token is missing or invalid.\n          - Returns `403 Forbidden` if the authenticated user is not an administrator.\n          - Returns `404 Not Found` if the category does not exist.\nrequest:\n  variables:\n    - name: baseUrl\n      value: https://mistri-lagbe-backend.vercel.app\ndocs:\n  content: |-\n    # mistri-lagbe API Collection Overview\n\n    The **mistri-lagbe** API collection provides a comprehensive backend ecosystem for a service marketplace connecting customers with skilled technicians (such as pest control, mosquito control, and home maintenance professionals). \n\n    It manages the entire lifecycle of on-demand service delivery\u2014from user authentication and technician profile management to booking workflows, payment processing, and customer reviews.\n\n    ---\n\n    ## \uD83C\uDFD7\uFE0F Architecture & Core Modules\n\n    The collection is organized into **7 core functional modules**:\n\n    * **Auth (`/auth`):** Handles user onboarding, email/password login, JWT access token issuance, and cookie-based refresh token handling.\n    * **User Management (`/users`):** Admin-level controls for managing user accounts, updating profile details, and toggling account statuses (`ACTIVE` vs `BANNED`).\n    * **Technician Management (`/technician-profile`):** Public directory for browsing technicians, alongside technician-only controls for managing availability schedules, bio, hourly rates, and incoming job requests.\n    * **Services (`/services`):** Catalog management allowing technicians to define and update their service offerings and categories.\n    * **Bookings (`/booking`):** The core state engine handling appointment scheduling, total cost calculation, cancellation rules, and admin oversight.\n    * **Payments (`/payment`):** Payment gateway integration for creating payment intents, handling transactions, and maintaining financial history.\n    * **Reviews (`/review`):** Feedback loop enabling customers to rate and review services after job completion.\n\n    ---\n\n    ## \uD83D\uDD10 Authentication & Role-Based Access (RBAC)\n\n    The API enforces strict Role-Based Access Control using **JWT Bearer Tokens** passed in the `Authorization` header, alongside secure `refreshToken` cookies for token rotation.\n\n    ### Supported User Roles\n\n    | Role | Capabilities & Scope |\n    | :--- | :--- |\n    | **Public / Guest** | Browse services & technicians, view individual technician profiles, register accounts, login. |\n    | **CUSTOMER** | Create/cancel bookings, initiate payment intents, view personal payment history, post reviews for paid services. |\n    | **TECHNICIAN** | Manage service listings, update professional profile/schedules, view assigned job requests, update booking execution status. |\n    | **ADMIN** | Full administrative access across all users, global booking logs, payment records, and user ban/unban capabilities. |\n\n    ---\n\n    ## \uD83D\uDD04 Core Business Workflows\n\n    ### 1. Booking State Lifecycle\n    Bookings transition through a tightly validated state machine driven by customer and technician interactions:\n\n    ```text\n    [CUSTOMER]                    [TECHNICIAN]                   [CUSTOMER]                     [TECHNICIAN]\n    Create Booking  \u2500\u2500\u2500>  Status: REQUESTED  \u2500\u2500\u2500>  Accept Request  \u2500\u2500\u2500>  Initiate Payment  \u2500\u2500\u2500>  Status: PAID\n                                   \u2502\n                           Can Cancel if REQUESTED\n                                   \u2502\n                                   \u25BC\n                           Status: CANCELED\n                                                                                                      \u2502\n                                                                                              Set IN_PROGRESS\n                                                                                                      \u2502\n                                                                                                      \u25BC\n                                                                                               Set COMPLETED\n                                                                                                      \u2502\n                                                                                                  [CUSTOMER]\n                                                                                                Submit Review\n    ```                                                                                          \n    ### 2. Payment & Review Guardrails\n    - Payments: Payment intents are generated directly from the total amount stored in the target booking record. Successful payments lock the booking into a payable state.\n    - Reviews: A customer can only submit a review if the associated booking exists, belongs to them, and has reached a valid completed/paid status.\n\n    ## \u2699\uFE0F Environment & Collection Setup\n    - Base URL Variable: Configured using standard Bruno variables via `{{baseUrl}}`.\n    - Global Headers: Endpoints inherit authentication globally or specify `Bearer <token>` overrides per request context.\n    - Proxy Configuration: Standard HTTP proxy inheritance enabled for regional/environment routing.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-07-24T06:30:23.704Z'\n    exportedUsing: Bruno/3.5.3\n";
