s a conflict error if the email is already registered.\n      - info:\n          name: login user\n          type: http\n          seq: 2\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/auth/login'\n          body:\n            type: json\n            data: |-\n              {\n                  \"email\": \"admin1@test.com\",\n                  \"password\": \"Password123\"\n              }\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n\n          Authenticates a user using their email and password.\n\n          ## Authorization\n\n          No authorization required.\n\n          ## Validation Rules\n\n          - Email is required, must be a valid email address, and is stored in lowercase.\n          - Password is required and cannot be empty.\n\n          ## Response\n\n          - Returns access and refresh tokens on successful authentication.\n          - Returns an authentication error if the email or password is incorrect.\n          - Returns a validation error if the request body is invalid.\n      - info:\n          name: refresh-token\n          type: http\n          seq: 3\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/auth/refresh'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n\n          Generates a new access token and refresh token using a valid refresh token.\n\n          ## Authorization\n\n          No authorization header required.\n\n          ## Validation Rules\n\n          - A `refreshToken` cookie is required.\n          - The refresh token must be valid and not expired.\n          - The refresh token must belong to an existing user.\n\n          ## Response\n\n          - Returns a new access token and refresh token on success.\n
