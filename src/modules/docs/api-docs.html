        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: mistri-lagbe\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: ''\n      port: ''\n      auth:\n        username: ''\n        password: ''\n      bypassProxy: ''\nitems:\n  - info:\n      name: auth\n      type: folder\n      seq: 1\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Get Me\n          type: http\n          seq: 4\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/auth/me'\n          auth:\n            type: bearer\n            token: ''\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Retrieves the authenticated user's profile information. If the user is a technician, the response also includes their technician profile details.\n\n          ## Authorization\n\n          Bearer Token required.\n\n          ## Validation Rules\n\n          - A valid access token must be provided in the `Authorization` header.\n          - The access token must belong to an existing user.\n\n          ## Response\n\n          - Returns the authenticated user's profile information.\n          - For technician accounts, also returns technician-specific details such as bio, experience, hourly rate, location, and availability.\n          - Returns `404 Not Found` if the authenticated user no longer exists.\n          - Returns `401 Unauthorized` if the access token is missing or invalid.\n      - info:\n          name: Login User\n          type: http\n          seq: 2\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/auth/login'\n          body:\n            type: json\n            data: |-\n              {\n                  \"email\": \"technician1@test.com\",\n                  \"password\": \"Password123\"\n              }\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n\n          Authenticates a user using their email and password.\n\n          ## Authorization\n\n          No authorization required.\n\n          ## Validation Rules\n\n          - Email is required, must be a valid email address, and is stored in lowercase.\n          - Password is required and cannot be empty.\n\n          ## Response\n\n          - Returns access and refresh tokens on successful authentication.\n          - Returns an authentication error if the email or password is incorrect.\n          - Returns a validation error if the request body is invalid.\n      - info:\n          name: Refresh Token\n          type: http\n          seq: 3\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/auth/refresh'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n\n          Generates a new access token and refresh token using a valid refresh token.\n\n          ## Authorization\n\n          No authorization header required.\n\n          ## Validation Rules\n\n          - A `refreshToken` cookie is required.\n          - The refresh token must be valid and not expired.\n          - The refresh token must belong to an existing user.\n\n          ## Response\n\n          - Returns a new access token and refresh token on success.\n          - Returns `401 Unauthorized` if the refresh token is missing, invalid, expired, or the associated user no longer exists.\n      - info:\n          name: Register User\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/auth/register'\n          body:\n            type: json\n            data: |-\n              {\n                  \"name\": \"technician1\",\n                  \"email\": \"technician1@test.com\",\ urns the updated booking.\n          - Returns `400 Bad Request` if the booking ID is missing or the booking cannot be canceled due to its current status.\n          - Returns `401 Unauthorized` if the access token is missing or invalid.\n          - Returns `403 Forbidden` if the booking does not belong to the authenticated user.\n          - Returns `404 Not Found` if the booking does not exist.\n      - info:\n          name: Create Booking\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: '{{baseUrl}}/api/v1/bookings'\n          body:\n            type: json\n            data: |-\n              {\n                  \"technicianId\": \"ed4dde0e-1d67-4d9c-8d06-07d85ff19365\",\n                  \"serviceId\": \"99add175-c535-4581-b0c1-b5d81244301b\",\n                  \"address\": \"House#07, Banani\",\n                  \"note\": \"This is service 2 note from user10\"\n              }\n          auth:\n            type: bearer\n            token: ''\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Creates a new booking request for the authenticated user.\n\n          ## Authorization\n\n          Bearer Token required.\n\n          ## Validation Rules\n\n          - A valid access token must be provided.\n          - `serviceId` is required and must reference an existing service.\n          - Any additional booking fields must satisfy the request validation schema.\n          - If provided, `note` is optional.\n\n          ## Response\n\n          - Creates a new booking with the status set to `REQUESTED`.\n          - Automatically assigns the authenticated user as the customer.\n          - Calculates and stores the total booking amount.\n          - Returns `201 Created` with the booking details on success.\n          - Returns `404 Not Found` if the specified service does not exist.\n          - Returns `401 Unauthorized` if the access token is missing or invalid.\n      - info:\n          name: Single Booking Details\n          type: http\n          seq: 3\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/bookings/205a2966-e7ae-439d-a3c7-7483da46fecc'\n          auth:\n            type: bearer\n            token: ''\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Retrieves the details of a specific booking owned by the authenticated user.\n\n          ## Authorization\n\n          Bearer Token required.\n\n          ## Validation Rules\n\n          - A valid access token must be provided.\n          - `id` (Booking ID) is required as a path parameter.\n          - The booking must exist.\n          - The authenticated user must be the owner of the booking.\n\n          ## Response\n\n          - Returns the booking details on success.\n          - Returns `400 Bad Request` if the booking ID is missing, the booking does not exist, or the authenticated user is not authorized to access it.\n          - Returns `401 Unauthorized` if the access token is missing or invalid.\n      - info:\n          name: Get All Bookings\n          type: http\n          seq: 4\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/bookings'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Retrieves a list of all bookings in the system.\n\n          ## Authorization\n\n          Bearer Token required (Admin only).\n\n          ## Validation Rules\n\n          - A valid access token must be provided.\n          - The authenticated user must have the `ADMIN` role.\n\n          ## Response\n\n          - Returns a list of all bookings.\n          - Returns `401 Unauthorized` if the access token is missing or invalid.\n          - Returns `403 Forbidden` if the authenticated user is not an administrator.\n  - info:\n      name: technician\n      type: folder\n      seq: 3\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Get All Service Requests\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/technician-profile/bookings'\n          auth:\n            type: bearer\n            token: ''\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Retrieves all incoming booking requests assigned to the authenticated technician.\n\n          ## Authorization\n\n          Bearer Token required (Technician only).\n\n          ## Validation Rules\n\n          - A valid access token must be provided.\n          - The authenticated user must have an associated technician profile.\n          - The technician profile must exist before retrieving booking requests.\n\n          ## Response\n\n          - Returns a list of incoming booking requests for the technician.\n          - Returns an error if the technician profile does not exist.\n          - Returns `401 Unauthorized` if the access token is missing or invalid.\n          - Returns `403 Forbidden` if the user is not authorized as a technician.\n      - info:\n          name: Update Profile\n          type: http\n          seq: 3\n        http:\n          method: PATCH\n          url: '{{baseUrl}}/api/v1/technician-profile'\n          body:\n            type: json\n            data: |-\n              {\n                \"location\": \"Dhaka 2\"\n              }\n          auth:\n            type: bearer\n            token: ''\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Updates the profile information of the authenticated technician. yment-intent'\n          body:\n            type: json\n            data: |-\n              {\n                \"bookingId\": \"205a2966-e7ae-439d-a3c7-7483da46fecc\"\n              }\n          auth:\n            type: bearer\n            token: ''\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Creates a payment session for a booking and returns the payment gateway URL for completing the transaction.\n\n          ## Authorization\n\n          Bearer Token required `(CUSTOMER)`.\n\n          ## Validation Rules\n\n          - A valid access token must be provided.\n          - `bookingId` is required in the request body.\n          - The booking must exist.\n          - The authenticated user must be the owner of the booking.\n          - The user associated with the booking must exist.\n          - Payment amount is generated from the booking total amount.\n          - A unique transaction ID is generated for the payment.\n\n          ## Response\n\n          - Creates a pending payment record.\n          - Returns the payment gateway URL and transaction ID for completing the payment.\n          - Returns `400 Bad Request` if the booking is invalid or the user is not authorized.\n          - Returns `401 Unauthorized` if the access token is missing or invalid.\n      - info:\n          name: Payment History\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/v1/payments/transactions'\n          auth:\n            type: bearer\n            token: ''\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Retrieves the payment history of the authenticated user.\n\n          ## Authorization\n\n          Bearer Token required.\n\n          ## Validation Rules\n\n          - A valid access token must be
